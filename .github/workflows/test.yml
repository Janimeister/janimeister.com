name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      called-from-deploy:
        description: 'Set to true when invoked by the deploy workflow to avoid cancelling in-flight deploy gates'
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs['called-from-deploy'] && 'deploy-tests' || format('tests-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs['called-from-deploy'] }}

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build & Type Check
    # Runs `build:ci` (tsc type-check + vite build, skipping the live YouTube
    # fetch prebuild step) so PR CI doesn't depend on external network availability.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci
      - name: Build (type check + vite build)
        run: npm run build:ci

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci
      - run: npm test
      - name: Node tests (shared build helpers + Worker)
        run: npm run test:node

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the repository npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          node --version
          npm --version

      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
