version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # All npm dependencies share one lockfile. Update runtime packages,
      # types, and build/test tooling together to keep peer dependencies
      # compatible and avoid competing version-update PRs on that lockfile.
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 declares `typescript@">=4.3 <7"`. Until a ts-jest release
      # supports TypeScript 7, bumping TS to 7 makes `npm ci` fail with
      # ERESOLVE. Drop this ignore once ts-jest widens the peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
